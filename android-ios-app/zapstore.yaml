# SPDX identifier, matching the LICENSE file in this repo (a verbatim copy of
# the one in Spl0itable/NYM). "-only" rather than "-or-later": neither the
# project README nor any source header offers the "or any later version"
# upgrade clause, so the grant is version 3 alone.
license: AGPL-3.0-only

