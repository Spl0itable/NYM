# Zapstore publishing manifest for Nymchat (com.nym.bar)
# Docs: https://zapstore.dev/docs/publish   CLI: https://github.com/zapstore/zsp
#
# Publish with:   SIGN_WITH=nsec1... zsp publish
# (run from the repo root, after `flutter build apk --release`)
#
# zsp reads the version/versionCode straight out of the APK, so there is no
# `version:` field here — bump `version:` in pubspec.yaml instead.

# The signed, universal release APK produced by `flutter build apk --release`.
# This is a LOCAL path, which also lets zsp use the local icon/screenshots
# below (offline-friendly). Point it at a URL/GitHub release instead if you
# ever want zsp to pull the artifact remotely.
release_source: build/app/outputs/flutter-apk/app-release.apk

# Source repository (shown on the listing).
repository: https://github.com/Spl0itable/NYM

# --- App metadata ---
name: Nymchat - Geohash Mesh Chat
summary: Encrypted chat with Bluetooth mesh. No phone number, no account, works offline.
description: |
  Nymchat is an encrypted messenger with no account, no phone number and no server that knows who you are.

  Your identity is a key your device generates. Keep it, back it up, or throw it away and make a new one. No email. No SMS code. Nothing to leak.

  ★ WORKS OFFLINE, OVER BLUETOOTH MESH

  When there is no internet and no cell service, Nymchat keeps working. Messages relay from phone to phone over a Bluetooth mesh — up to seven hops — so a crowded venue, a train tunnel, a hiking trail, a festival or a network blackout is still a conversation. Every message is encrypted on the mesh exactly as it is online, and everything syncs the moment one device reaches the network again. The mesh is compatible with Bitchat, so those devices join the same rooms.

  ★ PUBLIC CHANNELS BY LOCATION

  Geohash channels turn any place on Earth into a public chat room. The channel name is the location: everyone whose device resolves to the same square lands in the same room. Open the geohash explorer, spin the globe, and drop into anywhere. Named channels cover everything that is not about a place.

  ★ PRIVATE MESSAGES THAT HIDE THE METADATA

  Private and group chats are end-to-end encrypted and gift-wrapped, so the relays carrying them cannot tell who is talking to whom, let alone what was said. Turn read receipts and typing indicators off. Set messages to disappear. Private messages work over the Bluetooth mesh too.

  ★ AUDIO AND VIDEO CALLS

  One-to-one and group calls, set up over encrypted events and then carried peer to peer between the devices taking part. No server in the middle of the media.

  ★ GHOST MODE

  Rotate to a throwaway identity on a timer. Nickname, keys and the Bluetooth name the device advertises all change together, so one session cannot be linked to the last.

  ★ LIGHTNING PAYMENTS

  Zap sats to a good post without leaving the chat. Buy flair that changes how your messages and nickname look to everyone else in the app.

  ★ NYMBOT, THE BUILT-IN ASSISTANT

  Ask a question in any public channel for free — summarize the thread, translate a message, explain a command. Or open a private, encrypted chat with it.

  ★ AND THE REST

  Polls, reactions, replies, peer-to-peer file transfer, message translation into more than a hundred languages, six themes, block lists, keyword filters and reporting.

  ★ OPEN, DECENTRALIZED, UNOWNED

  Nymchat is built on Nostr, an open protocol nobody owns. There is no Nymchat account because there is no Nymchat server to hold one — the app talks to a network of independent relays, and you choose which. It is free software under the AGPL-3.0 and the source is public.

  Private chat that survives the network going down. Decentralized. Pseudonymous. Unstoppable.

