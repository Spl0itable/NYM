// NOTE: Plugin versions are declared once in settings.gradle via the plugins {}
// DSL (AGP 8.11.1 / Kotlin 2.2.20). A legacy `buildscript { classpath ... }`
// block used to live here pinning AGP 8.7.3, which silently won and made the
// effective toolchain older than declared — AGP 8.7 has no built-in support for
// compileSdk 36 (Android 16). It has been removed intentionally; do not re-add.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Use JVM Toolchain to force consistent JVM 17 across all modules (app + plugins)
subprojects { project ->
    // Configure Java Toolchain for all subprojects
    project.plugins.withId("org.jetbrains.kotlin.android") {
        project.kotlin {
            jvmToolchain(17)
        }
    }
    
    // Apply to Android app modules
    project.plugins.withId("com.android.application") {
        project.android {
            compileSdk = 36
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }

    // Apply to Android library modules (including Flutter plugins).
    // Many plugins still declare compileSdk 33/34; forcing 36 keeps every
    // module on the Android 16 platform so resource linking stays consistent.
    project.plugins.withId("com.android.library") {
        project.android {
            compileSdk = 36
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
